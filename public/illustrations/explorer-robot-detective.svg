<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Robot detective illustration</title>
  <desc id="desc">A friendly robot compares everyday machines using the Sense, Decide, Act cycle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#160714"/><stop offset="1" stop-color="#081521"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="1"><stop stop-color="#6B0F24"/><stop offset="1" stop-color="#35132d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="610" cy="74" r="102" fill="#F5B800" opacity=".08"/>
  <path d="M0 390C130 330 187 486 333 425s201-68 387-16v71H0Z" fill="#051019"/>
  <text x="48" y="57" fill="#F5B800" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">ROBOT DETECTIVE</text>
  <text x="48" y="86" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="800">What makes a real robot?</text>
  <g transform="translate(76 150)">
    <rect width="236" height="202" rx="22" fill="url(#panel)" stroke="#F5B800" stroke-opacity=".45"/>
    <rect x="28" y="37" width="114" height="84" rx="24" fill="#F5B800"/>
    <rect x="41" y="52" width="88" height="54" rx="18" fill="#151827"/>
    <circle cx="64" cy="79" r="11" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="106" cy="79" r="11" fill="#38bdf8" filter="url(#glow)"/>
    <path d="M75 100q11 11 22 0" fill="none" stroke="#F5B800" stroke-width="5" stroke-linecap="round"/>
    <path d="M85 37V13h24v24" fill="none" stroke="#F5B800" stroke-width="9" stroke-linejoin="round"/>
    <path d="M28 146h112" stroke="#fff" stroke-opacity=".5" stroke-width="8" stroke-linecap="round"/>
    <text x="28" y="169" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Look for three clues</text>
    <text x="28" y="190" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">Eyes + brain + action</text>
  </g>
  <g transform="translate(367 134)">
    <circle cx="63" cy="70" r="51" fill="#0d2633" stroke="#38bdf8" stroke-width="3"/>
    <path d="M39 77q24-34 48 0" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="47" cy="57" r="7" fill="#fff"/><circle cx="79" cy="57" r="7" fill="#fff"/>
    <text x="63" y="151" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">SENSE</text>
    <path d="M132 71h48" stroke="#F5B800" stroke-width="4" stroke-linecap="round"/><path d="M168 60l13 11-13 11" fill="#F5B800"/>
    <rect x="194" y="28" width="122" height="84" rx="17" fill="#2f173b" stroke="#c084fc" stroke-width="3"/>
    <rect x="222" y="50" width="66" height="40" rx="7" fill="#6B0F24"/>
    <path d="M230 61h50M230 70h31M230 79h45" stroke="#F5B800" stroke-width="4" stroke-linecap="round"/>
    <text x="255" y="151" fill="#c084fc" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">DECIDE</text>
    <path d="M329 71h48" stroke="#F5B800" stroke-width="4" stroke-linecap="round"/><path d="M365 60l13 11-13 11" fill="#F5B800"/>
    <g transform="translate(401 26)">
      <rect width="128" height="90" rx="45" fill="#24321d" stroke="#86efac" stroke-width="3"/>
      <circle cx="34" cy="92" r="22" fill="#1f2937" stroke="#86efac" stroke-width="7"/><circle cx="94" cy="92" r="22" fill="#1f2937" stroke="#86efac" stroke-width="7"/>
      <path d="M64 24v37" stroke="#F5B800" stroke-width="8" stroke-linecap="round"/>
    </g>
    <text x="466" y="151" fill="#86efac" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">ACT</text>
  </g>
  <rect x="367" y="337" width="305" height="66" rx="15" fill="#F5B800" fill-opacity=".12" stroke="#F5B800" stroke-opacity=".5"/>
  <text x="391" y="365" fill="#F5B800" font-family="Arial, sans-serif" font-size="16" font-weight="700">Detective mission:</text>
  <text x="391" y="388" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Find the senses, brain, and muscles.</text>
</svg>
