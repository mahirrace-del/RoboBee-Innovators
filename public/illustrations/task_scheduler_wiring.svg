<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="Reference wiring illustration: Arduino Uno non-blocking task scheduler with Pin 2 button interrupt, Pin 12 heartbeat LED, Pin 13 status LED.">
  <rect width="560" height="320" fill="#0f172a" rx="12"/>
  <text x="280" y="26" font-family="monospace" font-size="13" fill="#F5B800" text-anchor="middle" font-weight="bold">ADVANCED 03 — Non-Blocking Task Scheduler &amp; Hardware Interrupt (INT0)</text>
  <text x="280" y="44" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Hardware schematic: Pin 2 (INT0), Pin 12 (2Hz Heartbeat), Pin 13 (Status) with Star GND.</text>
  <!-- Arduino -->
  <rect x="30" y="60" width="130" height="220" rx="8" fill="#1e3a1e" stroke="#2d5a2d" stroke-width="2"/>
  <text x="95" y="79" font-family="monospace" font-size="10" fill="#86efac" text-anchor="middle" font-weight="bold">Arduino Uno</text>
  <rect x="148" y="95" width="14" height="10" rx="2" fill="#38bdf8"/>
  <text x="143" y="92" font-family="monospace" font-size="8" fill="#38bdf8" text-anchor="end">Pin 2 (INT0)</text>
  <rect x="148" y="125" width="14" height="10" rx="2" fill="#22c55e"/>
  <text x="143" y="122" font-family="monospace" font-size="8" fill="#22c55e" text-anchor="end">Pin 12</text>
  <rect x="148" y="155" width="14" height="10" rx="2" fill="#F5B800"/>
  <text x="143" y="152" font-family="monospace" font-size="8" fill="#F5B800" text-anchor="end">Pin 13</text>
  <rect x="148" y="185" width="14" height="10" rx="2" fill="#ef4444"/>
  <text x="143" y="182" font-family="monospace" font-size="8" fill="#ef4444" text-anchor="end">GND</text>
  <!-- Button (Pin 2) -->
  <rect x="230" y="85" width="70" height="30" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="265" y="104" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">INT BUTTON</text>
  <line x1="162" y1="100" x2="230" y2="100" stroke="#38bdf8" stroke-width="2"/>
  <line x1="265" y1="115" x2="265" y2="230" stroke="#ef4444" stroke-width="2"/>
  <!-- Heartbeat LED (Pin 12) -->
  <rect x="230" y="120" width="35" height="12" rx="2" fill="#8B4513" stroke="#d97706" stroke-width="1"/>
  <text x="247" y="115" font-family="monospace" font-size="7" fill="#fbbf24" text-anchor="middle">330Ω</text>
  <line x1="162" y1="130" x2="230" y2="126" stroke="#22c55e" stroke-width="2"/>
  <polygon points="280,120 280,132 292,126" fill="#22c55e"/>
  <line x1="292" y1="120" x2="292" y2="132" stroke="#22c55e" stroke-width="2"/>
  <text x="315" y="129" font-family="monospace" font-size="8" fill="#22c55e">2Hz Heartbeat</text>
  <line x1="292" y1="126" x2="350" y2="126" stroke="#ef4444" stroke-width="2"/>
  <line x1="350" y1="126" x2="350" y2="230" stroke="#ef4444" stroke-width="2"/>
  <!-- Common Ground Bus Line -->
  <line x1="162" y1="190" x2="200" y2="190" stroke="#ef4444" stroke-width="2"/>
  <line x1="200" y1="190" x2="200" y2="230" stroke="#ef4444" stroke-width="2"/>
  <line x1="200" y1="230" x2="350" y2="230" stroke="#ef4444" stroke-width="2"/>
  <!-- Info Card -->
  <rect x="360" y="150" width="180" height="120" rx="6" fill="#090e18" stroke="#1e293b" stroke-width="1"/>
  <text x="450" y="172" font-family="monospace" font-size="10" fill="#F5B800" text-anchor="middle" font-weight="bold">TIMING ARCHITECTURE</text>
  <text x="375" y="195" font-family="monospace" font-size="8" fill="#94a3b8">• 100 Hz Motor PID</text>
  <text x="375" y="212" font-family="monospace" font-size="8" fill="#94a3b8">• 50 Hz Sensors (A0)</text>
  <text x="375" y="229" font-family="monospace" font-size="8" fill="#94a3b8">• 2 Hz Heartbeat LED</text>
  <text x="375" y="246" font-family="monospace" font-size="8" fill="#86efac">• &gt;25,000 Hz Loop Speed</text>
</svg>
