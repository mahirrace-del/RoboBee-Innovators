  <text x="52" y="59" fill="#F5B800" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2">YOUR FIRST ROBOTICS ADVENTURE</text><text x="52" y="87" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="800">Four small missions. One big idea.</text>
