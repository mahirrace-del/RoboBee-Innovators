  <g transform="translate(384 200)"><circle cx="45" cy="45" r="42" fill="#163329" stroke="#86efac" stroke-width="3"/><rect x="13" y="28" width="64" height="31" rx="14" fill="#F5B800"/><circle cx="25" cy="64" r="12" fill="#151827" stroke="#cbd5e1" stroke-width="4"/><circle cx="65" cy="64" r="12" fill="#151827" stroke="#cbd5e1" stroke-width="4"/><text x="45" y="106" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">MOVE</text></g>
