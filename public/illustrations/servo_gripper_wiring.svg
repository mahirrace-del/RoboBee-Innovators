<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="540" height="340" role="img" aria-label="Reference wiring illustration: Intermediate 06 Servo Mechanisms and Robotic Gripper Claw with SG90 Servomotor, External 5V Power, and Arduino Uno.">
  <rect width="540" height="340" fill="#0f172a" rx="12"/>
  <text x="270" y="26" font-family="monospace" font-size="13" fill="#F5B800" text-anchor="middle" font-weight="bold">INTERMEDIATE 06 — Servo Gripper Claw Wiring</text>
  <text x="270" y="44" font-family="monospace" font-size="9.5" fill="#94a3b8" text-anchor="middle">Reference diagram — external 5V supply with common ground prevents servo reboot brownouts.</text>

  <!-- Arduino Uno Block (Left) -->
  <rect x="30" y="70" width="160" height="180" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="95" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle" font-weight="bold">Arduino Uno R3</text>
  <rect x="40" y="115" width="140" height="24" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="110" y="131" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Pin 9 (PWM Control)</text>
  <rect x="40" y="150" width="140" height="24" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="110" y="166" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">GND (Common Ground)</text>
  <text x="110" y="200" font-family="monospace" font-size="8.5" fill="#64748b" text-anchor="middle">USB 5V for Logic Only</text>
  <text x="110" y="220" font-family="monospace" font-size="8" fill="#38bdf8" text-anchor="middle">Servo.attach(9);</text>

  <!-- External 5V Power Supply Block (Center Bottom) -->
  <rect x="220" y="180" width="130" height="70" rx="6" fill="#1c1917" stroke="#ef4444" stroke-width="1.5"/>
  <text x="285" y="202" font-family="monospace" font-size="10" fill="#fca5a5" text-anchor="middle" font-weight="bold">External 5V (2A)</text>
  <text x="285" y="220" font-family="monospace" font-size="8.5" fill="#ef4444" text-anchor="middle">(+) Red ➔ Servo VCC</text>
  <text x="285" y="236" font-family="monospace" font-size="8.5" fill="#94a3b8" text-anchor="middle">(-) Black ➔ Shared GND</text>

  <!-- Wire Connections -->
  <!-- Signal Wire (Orange) -->
  <path d="M 180 127 L 370 127" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <text x="270" y="120" font-family="monospace" font-size="8.5" fill="#fb923c" text-anchor="middle">Signal (Orange / White)</text>

  <!-- Shared Ground Wire (Black) -->
  <path d="M 180 162 L 220 162 L 220 232 L 350 232 L 385 232 L 385 155 L 390 155" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- SG90 Micro Servo (Right) -->
  <rect x="370" y="70" width="140" height="150" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="440" y="95" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle" font-weight="bold">SG90 Servo</text>
  <circle cx="440" cy="130" r="16" fill="#0284c7" stroke="#bae6fd" stroke-width="2"/>
  <line x1="440" y1="130" x2="455" y2="120" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="440" y="165" font-family="monospace" font-size="8.5" fill="#e0e7ff" text-anchor="middle">Brown ➔ GND</text>
  <text x="440" y="180" font-family="monospace" font-size="8.5" fill="#fca5a5" text-anchor="middle">Red ➔ Ext 5V (+)</text>
  <text x="440" y="195" font-family="monospace" font-size="8.5" fill="#fdba74" text-anchor="middle">Orange ➔ D9 (PWM)</text>

  <!-- Angle Calibration Note -->
  <rect x="30" y="265" width="480" height="60" rx="6" fill="#090e18" stroke="#1e293b" stroke-width="1"/>
  <text x="270" y="284" font-family="monospace" font-size="9" fill="#F5B800" text-anchor="middle" font-weight="bold">⚠ Calibration Rule: Always upload 90° center sketch BEFORE attaching horn to gripper claw.</text>
  <text x="270" y="300" font-family="monospace" font-size="8.5" fill="#cbd5e1" text-anchor="middle">Safe Limits: OPEN_ANGLE = 120°, GRIP_ANGLE = 45°. Never force past physical contact to prevent motor stall!</text>
  <text x="270" y="315" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">Instructor-developed illustration — RoboBEE Innovators © Proprietary</text>
</svg>