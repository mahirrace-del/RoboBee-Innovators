<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Rover route challenge illustration</title>
  <desc id="desc">A small wheeled rover follows a gold path through a friendly grid course.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#061826"/><stop offset="1" stop-color="#150a19"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="720" height="480" rx="28" fill="url(#bg)"/>
  <text x="46" y="55" fill="#F5B800" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">MOTION CHALLENGE</text>
  <text x="46" y="84" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="800">Plan, turn, and reach the flag.</text>
  <g transform="translate(50 118)">
    <rect width="600" height="282" rx="20" fill="#06111b" stroke="#1e4a5a" stroke-width="3"/>
    <g stroke="#1d3342" stroke-width="2"><path d="M75 0v282M150 0v282M225 0v282M300 0v282M375 0v282M450 0v282M525 0v282"/><path d="M0 70h600M0 141h600M0 212h600"/></g>
    <path d="M77 246h145v-105h150v-82h144" fill="none" stroke="#F5B800" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)"/>
    <path d="M77 246h145v-105h150v-82h144" fill="none" stroke="#fff4be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 10"/>
    <g transform="translate(35 197)"><rect x="6" y="20" width="80" height="43" rx="17" fill="#6B0F24" stroke="#F5B800" stroke-width="3"/><circle cx="25" cy="67" r="14" fill="#121722" stroke="#cbd5e1" stroke-width="5"/><circle cx="68" cy="67" r="14" fill="#121722" stroke="#cbd5e1" stroke-width="5"/><circle cx="27" cy="41" r="7" fill="#38bdf8"/><circle cx="65" cy="41" r="7" fill="#38bdf8"/><path d="M46 20V6" stroke="#F5B800" stroke-width="5" stroke-linecap="round"/></g>
    <g transform="translate(512 25)"><path d="M0 68V0h47l-12 20 12 20H14v28" fill="#ef4444"/><path d="M0 68V0" stroke="#e2e8f0" stroke-width="5"/></g>
    <g fill="#183143" stroke="#38bdf8" stroke-width="2"><rect x="91" y="16" width="47" height="42" rx="8"/><rect x="283" y="213" width="48" height="43" rx="8"/><rect x="448" y="145" width="50" height="42" rx="8"/></g>
  </g>
  <g font-family="Arial, sans-serif"><rect x="50" y="422" width="182" height="31" rx="15" fill="#38bdf8" fill-opacity=".13"/><text x="67" y="443" fill="#a5f3fc" font-size="14" font-weight="700">1. Choose a route</text><rect x="260" y="422" width="182" height="31" rx="15" fill="#F5B800" fill-opacity=".13"/><text x="277" y="443" fill="#fef3c7" font-size="14" font-weight="700">2. Command each turn</text><rect x="470" y="422" width="182" height="31" rx="15" fill="#86efac" fill-opacity=".13"/><text x="487" y="443" fill="#bbf7d0" font-size="14" font-weight="700">3. Test and improve</text></g>
</svg>
