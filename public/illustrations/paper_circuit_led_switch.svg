<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="540" height="340" role="img" aria-label="Reference wiring illustration: Explorer 02 Paper Circuit with 3V Coin Cell, Push Flap Switch, and 5mm LED. No microcontroller code used.">
  <rect width="540" height="340" fill="#0f172a" rx="12"/>
  <text x="270" y="28" font-family="monospace" font-size="13" fill="#F5B800" text-anchor="middle" font-weight="bold">EXPLORER 02 — Switch-and-LED Paper Circuit</text>
  <text x="270" y="46" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Supervised low-voltage paper circuit — No microcontroller or program used.</text>

  <!-- Paper Card Base -->
  <rect x="40" y="70" width="460" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="55" y="92" font-family="monospace" font-size="11" fill="#475569" font-weight="bold">Cardboard / Paper Canvas</text>

  <!-- Copper Tape Loop (Positive Rail - Gold/Amber) -->
  <path d="M 120 180 L 120 120 L 250 120" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
  <text x="180" y="112" font-family="monospace" font-size="9" fill="#b45309" font-weight="bold">Copper Tape (+) Line</text>

  <!-- Gap for LED -->
  <!-- 5mm LED -->
  <g transform="translate(260, 110)">
    <circle cx="15" cy="10" r="14" fill="#ef4444" opacity="0.9" stroke="#b91c1c" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="8" y2="10" stroke="#f59e0b" stroke-width="3"/>
    <line x1="22" y1="10" x2="30" y2="10" stroke="#64748b" stroke-width="3"/>
    <text x="15" y="38" font-family="monospace" font-size="9" fill="#dc2626" font-weight="bold" text-anchor="middle">5mm Red LED</text>
    <text x="0" y="5" font-family="monospace" font-size="8" fill="#15803d" font-weight="bold">+</text>
    <text x="26" y="5" font-family="monospace" font-size="8" fill="#475569" font-weight="bold">-</text>
    <text x="15" y="-5" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">Long leg = (+)</text>
  </g>

  <!-- Copper Tape Continuation to Switch -->
  <path d="M 300 120 L 410 120 L 410 160" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>

  <!-- Paper Flap Push Switch -->
  <g transform="translate(370, 160)">
    <rect x="0" y="0" width="60" height="35" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="10" y1="28" x2="50" y2="12" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <circle cx="10" cy="28" r="4" fill="#b45309"/>
    <circle cx="50" cy="28" r="4" fill="#b45309"/>
    <text x="30" y="48" font-family="monospace" font-size="9" fill="#475569" font-weight="bold" text-anchor="middle">Foldable Flap Switch</text>
    <text x="30" y="-4" font-family="monospace" font-size="8" fill="#0284c7" font-weight="bold" text-anchor="middle">Press to close circuit!</text>
  </g>

  <!-- Copper Tape from Switch to Battery Negative -->
  <path d="M 410 205 L 410 240 L 140 240 L 140 205" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>

  <!-- 3V CR2032 Coin Cell -->
  <g transform="translate(85, 160)">
    <circle cx="35" cy="25" r="28" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <text x="35" y="22" font-family="monospace" font-size="10" fill="#0f172a" font-weight="bold" text-anchor="middle">CR2032</text>
    <text x="35" y="35" font-family="monospace" font-size="9" fill="#1e293b" text-anchor="middle">3V (+ top)</text>
    <text x="35" y="65" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">Binder Clip Holder</text>
  </g>

  <!-- Safety Banner -->
  <rect x="40" y="290" width="460" height="36" rx="6" fill="#090e18" stroke="#1e293b" stroke-width="1"/>
  <text x="270" y="306" font-family="monospace" font-size="9" fill="#f87171" text-anchor="middle" font-weight="bold">⚠ Adult Supervision Required: Never short battery terminals directly with bare metal. Keep coin cells away from small children.</text>
  <text x="270" y="318" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">Instructor-developed illustration — RoboBEE Innovators © Proprietary</text>
</svg>