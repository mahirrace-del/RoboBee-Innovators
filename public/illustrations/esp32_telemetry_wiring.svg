<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="Reference wiring illustration: ESP32 32-bit microcontroller hosting local Wi-Fi Access Point telemetry dashboard with TB6612 motor driver.">
  <rect width="560" height="320" fill="#0f172a" rx="12"/>
  <text x="280" y="26" font-family="monospace" font-size="13" fill="#F5B800" text-anchor="middle" font-weight="bold">ADVANCED 08 — ESP32 Dual-Core Local Wi-Fi AP &amp; Telemetry Dashboard</text>
  <text x="280" y="44" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Standalone 240MHz 32-bit controller hosting offline browser telemetry at 20 Hz.</text>
  <!-- ESP32 Board -->
  <rect x="30" y="65" width="150" height="220" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="105" y="85" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle" font-weight="bold">ESP32 DevKit V1</text>
  <text x="105" y="98" font-family="monospace" font-size="8" fill="#93c5fd" text-anchor="middle">Dual-Core 240MHz</text>
  <!-- Wi-Fi Waves -->
  <path d="M 90,115 A 15,15 0 0,1 120,115" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 82,108 A 25,25 0 0,1 128,108" fill="none" stroke="#F5B800" stroke-width="2"/>
  <text x="105" y="132" font-family="monospace" font-size="8" fill="#F5B800" text-anchor="middle">Local AP Mode</text>
  <!-- ESP32 Pins -->
  <rect x="168" y="145" width="12" height="8" rx="1" fill="#ef4444"/>
  <text x="163" y="142" font-family="monospace" font-size="7" fill="#ef4444" text-anchor="end">VIN (5V)</text>
  <rect x="168" y="165" width="12" height="8" rx="1" fill="#64748b"/>
  <text x="163" y="162" font-family="monospace" font-size="7" fill="#64748b" text-anchor="end">GND</text>
  <rect x="168" y="185" width="12" height="8" rx="1" fill="#38bdf8"/>
  <text x="163" y="182" font-family="monospace" font-size="7" fill="#38bdf8" text-anchor="end">GPIO 18, 19 (PWM)</text>
  <rect x="168" y="205" width="12" height="8" rx="1" fill="#22c55e"/>
  <text x="163" y="202" font-family="monospace" font-size="7" fill="#22c55e" text-anchor="end">GPIO 21, 22 (Dirs)</text>
  <!-- TB6612 Driver -->
  <rect x="235" y="130" width="120" height="120" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="295" y="152" font-family="monospace" font-size="10" fill="#bfdbfe" text-anchor="middle" font-weight="bold">TB6612FNG</text>
  <text x="295" y="168" font-family="monospace" font-size="8" fill="#93c5fd" text-anchor="middle">LEDC PWM Control</text>
  <!-- Wires -->
  <line x1="180" y1="149" x2="235" y2="149" stroke="#ef4444" stroke-width="2"/>
  <line x1="180" y1="169" x2="235" y2="169" stroke="#64748b" stroke-width="2"/>
  <line x1="180" y1="189" x2="235" y2="189" stroke="#38bdf8" stroke-width="2"/>
  <line x1="180" y1="209" x2="235" y2="209" stroke="#22c55e" stroke-width="2"/>
  <!-- Phone Browser Mockup -->
  <rect x="385" y="70" width="150" height="215" rx="12" fill="#090e18" stroke="#38bdf8" stroke-width="2"/>
  <rect x="440" y="76" width="40" height="5" rx="2" fill="#334155"/>
  <text x="460" y="102" font-family="monospace" font-size="9" fill="#F5B800" text-anchor="middle" font-weight="bold">ROBOBEE DASHBOARD</text>
  <rect x="400" y="115" width="120" height="40" rx="4" fill="#1e293b"/>
  <text x="460" y="132" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">BATTERY VOLTAGE</text>
  <text x="460" y="148" font-family="monospace" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="bold">7.42 V</text>
  <rect x="400" y="165" width="120" height="40" rx="4" fill="#1e293b"/>
  <text x="460" y="182" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">SONAR DISTANCE</text>
  <text x="460" y="198" font-family="monospace" font-size="12" fill="#22c55e" text-anchor="middle" font-weight="bold">35 cm</text>
  <text x="460" y="225" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">WebSocket: 20 Hz</text>
  <text x="460" y="240" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">192.168.4.1 (No Cloud)</text>
</svg>
