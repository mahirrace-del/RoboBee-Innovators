<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="Reference wiring illustration: Dual-Rail power architecture with 7.4V fused motor bus, MP1584 buck converter to 5.0V logic bus, and Star Ground.">
  <rect width="560" height="320" fill="#0f172a" rx="12"/>
  <text x="280" y="26" font-family="monospace" font-size="13" fill="#F5B800" text-anchor="middle" font-weight="bold">ADVANCED 02 — Isolated Dual-Rail Power Distribution Architecture</text>
  <text x="280" y="44" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">7.4V Motor Rail with 3A fuse &amp; 470uF cap; 5.0V Buck Logic Rail with Star Common Ground.</text>
  <!-- Battery -->
  <rect x="25" y="85" width="80" height="150" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="65" y="150" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle" font-weight="bold">2S 7.4V</text>
  <text x="65" y="165" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Li-Po / Li-Ion</text>
  <!-- Fuse & Switch -->
  <rect x="135" y="90" width="40" height="20" rx="3" fill="#ef4444"/>
  <text x="155" y="104" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle">3A FUSE</text>
  <line x1="105" y1="100" x2="135" y2="100" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="175" y1="100" x2="220" y2="100" stroke="#ef4444" stroke-width="2.5"/>
  <!-- TB6612 Motor Driver (Rail 1: 7.4V) -->
  <rect x="220" y="70" width="130" height="85" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="285" y="92" font-family="monospace" font-size="10" fill="#bfdbfe" text-anchor="middle" font-weight="bold">TB6612FNG</text>
  <text x="285" y="107" font-family="monospace" font-size="8" fill="#93c5fd" text-anchor="middle">VM Pin: 7.4V Fused</text>
  <text x="285" y="122" font-family="monospace" font-size="8" fill="#93c5fd" text-anchor="middle">470µF Filter Across VM</text>
  <!-- Buck Converter (Rail 2: 5.0V) -->
  <rect x="220" y="175" width="130" height="85" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="285" y="197" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle" font-weight="bold">BUCK CONVERTER</text>
  <text x="285" y="212" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">IN: 7.4V ➔ OUT: 5.0V</text>
  <text x="285" y="227" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">&gt;90% Efficiency (&lt;0.1W)</text>
  <!-- Arduino Uno (Logic) -->
  <rect x="390" y="110" width="140" height="150" rx="8" fill="#1e3a1e" stroke="#2d5a2d" stroke-width="2"/>
  <text x="460" y="132" font-family="monospace" font-size="10" fill="#86efac" text-anchor="middle" font-weight="bold">Arduino Uno</text>
  <text x="460" y="148" font-family="monospace" font-size="8" fill="#bbf7d0" text-anchor="middle">5V Logic Bus</text>
  <text x="460" y="164" font-family="monospace" font-size="8" fill="#bbf7d0" text-anchor="middle">No Brownout (BOD)</text>
  <!-- Power connection lines -->
  <line x1="200" y1="100" x2="200" y2="200" stroke="#ef4444" stroke-width="2"/>
  <line x1="200" y1="200" x2="220" y2="200" stroke="#ef4444" stroke-width="2"/>
  <line x1="350" y1="205" x2="390" y2="205" stroke="#10b981" stroke-width="2.5"/>
  <text x="370" y="197" font-family="monospace" font-size="7" fill="#10b981" text-anchor="middle">5.0V</text>
  <!-- Ground Lines -->
  <line x1="105" y1="215" x2="220" y2="215" stroke="#64748b" stroke-width="2.5"/>
  <line x1="350" y1="225" x2="390" y2="225" stroke="#64748b" stroke-width="2.5"/>
  <line x1="285" y1="155" x2="285" y2="175" stroke="#64748b" stroke-width="2"/>
</svg>
