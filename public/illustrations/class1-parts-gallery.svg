<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="50%" stop-color="#161B26" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090e18" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" rx="16" fill="url(#bgGrad5)" stroke="#1e293b" stroke-width="2" />

  <!-- Top Title Banner -->
  <rect x="30" y="20" width="670" height="34" rx="17" fill="rgba(245, 184, 0, 0.12)" stroke="#F5B800" stroke-width="1.2" />
  <text x="45" y="43" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#F5B800" letter-spacing="1">
    ROBOTICS HARDWARE PARTS GALLERY &bull; 12 CORE WORKSHOP KIT COMPONENTS
  </text>

  <!-- Mandatory Reference Badge -->
  <g transform="translate(730, 20)">
    <rect width="440" height="34" rx="8" fill="#6B0F24" stroke="#F5B800" stroke-width="1.2" />
    <text x="220" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
      ⚠ RoboBEE Reference Illustration — Verify Hardware Before Powering
    </text>
  </g>

  <!-- ========================================================== -->
  <!-- 12-TILE GRID: 4 COLUMNS X 3 ROWS -->
  <!-- Col 1: x=40, Col 2: x=330, Col 3: x=620, Col 4: x=910 (width=250) -->
  <!-- Row 1: y=75, Row 2: y=310, Row 3: y=545 (height=215) -->
  <!-- ========================================================== -->

  <!-- ROW 1, COL 1: ARDUINO UNO R3 -->
  <g transform="translate(40, 75)">
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="12" width="75" height="20" rx="10" fill="#6B0F24" />
    <text x="52" y="26" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">DECIDE</text>
    <circle cx="130" cy="78" r="32" fill="rgba(0, 135, 138, 0.2)" stroke="#00878a" stroke-width="1.5" />
    <text x="130" y="88" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">🧠</text>
    <text x="130" y="132" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Arduino Uno R3</text>
    <text x="130" y="152" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F5B800" text-anchor="middle">ATmega328P MCU &bull; 16 MHz</text>
    <text x="130" y="176" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">The programmable controller</text>
    <text x="130" y="192" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">brain running C++ logic.</text>
  </g>

  <!-- ROW 1, COL 2: 400-POINT BREADBOARD -->
  <g transform="translate(325, 75)">
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="12" width="90" height="20" rx="10" fill="#334155" />
    <text x="60" y="26" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#cbd5e1" text-anchor="middle">PROTOTYPE</text>
    <circle cx="130" cy="78" r="32" fill="rgba(248, 250, 252, 0.15)" stroke="#94a3b8" stroke-width="1.5" />
    <text x="130" y="88" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">🔌</text>
    <text x="130" y="132" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">400-Pt Breadboard</text>
    <text x="130" y="152" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" text-anchor="middle">Internal Spring Clips</text>
    <text x="130" y="176" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Solderless prototyping base</text>
    <text x="130" y="192" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">with power rails &amp; DIP gap.</text>
  </g>

  <!-- ROW 1, COL 3: 5mm RED LED -->
  <g transform="translate(610, 75)">
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="12" width="60" height="20" rx="10" fill="#10B981" />
    <text x="45" y="26" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#161B26" text-anchor="middle">ACT</text>
    <circle cx="130" cy="78" r="32" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1.5" />
    <text x="130" y="88" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">💡</text>
    <text x="130" y="132" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">5mm Red Diffused LED</text>
    <text x="130" y="152" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ef4444" text-anchor="middle">Vf = 2.0V &bull; Max 20 mA</text>
    <text x="130" y="176" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Visual photon signaling:</text>
    <text x="130" y="192" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Anode (+) to Cathode (-).</text>
  </g>

  <!-- ROW 1, COL 4: 220 OHM RESISTOR -->
  <g transform="translate(895, 75)">
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="12" width="75" height="20" rx="10" fill="#F5B800" />
    <text x="52" y="26" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#161B26" text-anchor="middle">PROTECT</text>
    <circle cx="130" cy="78" r="32" fill="rgba(245, 184, 0, 0.2)" stroke="#F5B800" stroke-width="1.5" />
    <text x="130" y="88" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">🛡️</text>
    <text x="130" y="132" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">220 &Omega; Resistor</text>
    <text x="130" y="152" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F5B800" text-anchor="middle">Red-Red-Brown-Gold</text>
    <text x="130" y="176" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Current limiter (Ohm's Law)</text>
    <text x="130" y="192" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">protects pins from burnout.</text>
  </g>

  <!-- ROW 2, COL 1: TACTILE PUSHBUTTON -->
  <g transform="translate(40, 310)">
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="12" width="65" height="20" rx="10" fill="#F5B800" />
    <text x="47" y="26" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#161B26" text-anchor="middle">SENSE</text>
    <circle cx="130" cy="78" r="32" fill="rgba(245, 184, 0, 0.2)" stroke="#F5B800" stroke-width="1.5" />
    <text x="130" y="88" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">🔘</text>
    <text x="130" y="132" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Tactile Pushbutton</text>
    <text x="130" y="152" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" text-anchor="middle">Digital Touch Input</text>
    <text x="130" y="176" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Bridges pins when pressed;</text>
    <text x="130" y="192" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">detects user input/bumpers.</text>
  </g>

  <!-- ROW 2, COL 2: ULTRASONIC SENSOR HC-SR04 -->
  <g transform="translate(325, 310)">
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="12" width="65" height="20" rx="10" fill="#F5B800" />
    <text x="47" y="26" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#161B26" text-anchor="middle">SENSE</text>
    <circle cx="130" cy="78" r="32" fill="rgba(56, 189, 248, 0.2)" stroke="#38BDF8" stroke-width="1.5" />
    <text x="130" y="88" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">📡</text>
    <text x="130" y="132" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">HC-SR04 Ultrasonic</text>
    <text x="130" y="152" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" text-anchor="middle">40 kHz Sonar Rangefinder</text>
    <text x="130" y="176" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Measures distance (2–400cm)</text>
    <text x="130" y="192" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">via sound pulse echo timing.</text>
  </g>

  <!-- ROW 2, COL 3: IR REFLECTANCE SENSOR -->
  <g transform="translate(610, 310)">
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="12" width="65" height="20" rx="10" fill="#F5B800" />
    <text x="47" y="26" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#161B26" text-anchor="middle">SENSE</text>
    <circle cx="130" cy="78" r="32" fill="rgba(245, 184, 0, 0.2)" stroke="#F5B800" stroke-width="1.5" />
    <text x="130" y="88" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">👁️</text>
    <text x="130" y="132" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">IR Line Tracker Sensor</text>
    <text x="130" y="152" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F5B800" text-anchor="middle">Infrared Photodiode</text>
    <text x="130" y="176" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Distinguishes black line vs</text>
    <text x="130" y="192" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">white surface reflectance.</text>
  </g>

  <!-- ROW 2, COL 4: DC GEAR MOTOR -->
  <g transform="translate(895, 310)">
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="12" width="60" height="20" rx="10" fill="#10B981" />
    <text x="45" y="26" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#161B26" text-anchor="middle">ACT</text>
    <circle cx="130" cy="78" r="32" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5" />
    <text x="130" y="88" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">⚙️</text>
    <text x="130" y="132" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">DC Gear Motor (TT)</text>
    <text x="130" y="152" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981" text-anchor="middle">1:48 Reduction Gearbox</text>
    <text x="130" y="176" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Provides high torque wheel</text>
    <text x="130" y="192" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">drive for mobile rovers.</text>
  </g>

  <!-- ROW 3, COL 1: MOTOR DRIVER (TB6612 / L298N) -->
  <g transform="translate(40, 545)">
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="12" width="95" height="20" rx="10" fill="#6B0F24" />
    <text x="62" y="26" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">ACT / CONTROL</text>
    <circle cx="130" cy="78" r="32" fill="rgba(107, 15, 36, 0.3)" stroke="#F5B800" stroke-width="1.5" />
    <text x="130" y="88" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">🎛️</text>
    <text x="130" y="132" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Motor Driver (H-Bridge)</text>
    <text x="130" y="152" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F5B800" text-anchor="middle">TB6612FNG / L298N Dual</text>
    <text x="130" y="176" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Muscle amplifier bridging low</text>
    <text x="130" y="192" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">logic pins to high battery amps.</text>
  </g>

  <!-- ROW 3, COL 2: SG90 MICRO SERVO -->
  <g transform="translate(325, 545)">
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="12" width="60" height="20" rx="10" fill="#10B981" />
    <text x="45" y="26" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#161B26" text-anchor="middle">ACT</text>
    <circle cx="130" cy="78" r="32" fill="rgba(56, 189, 248, 0.2)" stroke="#38BDF8" stroke-width="1.5" />
    <text x="130" y="88" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">🦾</text>
    <text x="130" y="132" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">SG90 Micro Servo</text>
    <text x="130" y="152" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" text-anchor="middle">0° – 180° Closed-Loop</text>
    <text x="130" y="176" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Positions grippers and sensor</text>
    <text x="130" y="192" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">mounts with precision PWM.</text>
  </g>

  <!-- ROW 3, COL 3: ROBOT CHASSIS & WHEELS -->
  <g transform="translate(610, 545)">
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="12" width="85" height="20" rx="10" fill="#475569" />
    <text x="57" y="26" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#f1f5f9" text-anchor="middle">STRUCTURE</text>
    <circle cx="130" cy="78" r="32" fill="rgba(245, 184, 0, 0.15)" stroke="#64748b" stroke-width="1.5" />
    <text x="130" y="88" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">🚗</text>
    <text x="130" y="132" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Chassis &amp; Rubber Wheels</text>
    <text x="130" y="152" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">Laser-Cut Acrylic Base</text>
    <text x="130" y="176" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Rigid mechanical frame</text>
    <text x="130" y="192" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">carrying battery, MCU &amp; motors.</text>
  </g>

  <!-- ROW 3, COL 4: 3D-PRINTED BRACKET -->
  <g transform="translate(895, 545)">
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="12" width="85" height="20" rx="10" fill="#475569" />
    <text x="57" y="26" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#f1f5f9" text-anchor="middle">STRUCTURE</text>
    <circle cx="130" cy="78" r="32" fill="rgba(167, 139, 250, 0.2)" stroke="#a78bfa" stroke-width="1.5" />
    <text x="130" y="88" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">🖨️</text>
    <text x="130" y="132" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3D-Printed Sensor Mount</text>
    <text x="130" y="152" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a78bfa" text-anchor="middle">Custom PLA Fabrication</text>
    <text x="130" y="176" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">CAD-modeled in Class 8 with</text>
    <text x="130" y="192" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">exact M3 screw clearances.</text>
  </g>
</svg>
