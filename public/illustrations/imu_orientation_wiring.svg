<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="Reference wiring illustration: Arduino Uno connected to MPU-6050 6-DOF IMU over I2C bus (A4 SDA, A5 SCL) with AD0 to GND.">
  <rect width="560" height="320" fill="#0f172a" rx="12"/>
  <text x="280" y="26" font-family="monospace" font-size="13" fill="#F5B800" text-anchor="middle" font-weight="bold">ADVANCED 06 — MPU-6050 6-DOF IMU &amp; Fast-Mode I2C Bus (400 kHz)</text>
  <text x="280" y="44" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Hardware schematic: 5V logic power, A4 (SDA), A5 (SCL), AD0 grounded to 0x68 address.</text>
  <!-- Arduino -->
  <rect x="30" y="60" width="140" height="220" rx="8" fill="#1e3a1e" stroke="#2d5a2d" stroke-width="2"/>
  <text x="100" y="79" font-family="monospace" font-size="10" fill="#86efac" text-anchor="middle" font-weight="bold">Arduino Uno</text>
  <rect x="158" y="100" width="14" height="10" rx="2" fill="#ef4444"/>
  <text x="153" y="97" font-family="monospace" font-size="8" fill="#ef4444" text-anchor="end">5V</text>
  <rect x="158" y="125" width="14" height="10" rx="2" fill="#64748b"/>
  <text x="153" y="122" font-family="monospace" font-size="8" fill="#64748b" text-anchor="end">GND</text>
  <rect x="158" y="150" width="14" height="10" rx="2" fill="#38bdf8"/>
  <text x="153" y="147" font-family="monospace" font-size="8" fill="#38bdf8" text-anchor="end">A4 (SDA)</text>
  <rect x="158" y="175" width="14" height="10" rx="2" fill="#F5B800"/>
  <text x="153" y="172" font-family="monospace" font-size="8" fill="#F5B800" text-anchor="end">A5 (SCL)</text>
  <!-- MPU-6050 Breakout -->
  <rect x="290" y="75" width="100" height="170" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="340" y="95" font-family="monospace" font-size="10" fill="#f8fafc" text-anchor="middle" font-weight="bold">MPU-6050</text>
  <text x="340" y="108" font-family="monospace" font-size="8" fill="#bae6fd" text-anchor="middle">GY-521 (6-DOF)</text>
  <!-- Pins on MPU-6050 -->
  <rect x="280" y="120" width="10" height="8" rx="1" fill="#ef4444"/>
  <text x="295" y="127" font-family="monospace" font-size="7" fill="#f8fafc">VCC</text>
  <rect x="280" y="140" width="10" height="8" rx="1" fill="#64748b"/>
  <text x="295" y="147" font-family="monospace" font-size="7" fill="#f8fafc">GND</text>
  <rect x="280" y="160" width="10" height="8" rx="1" fill="#F5B800"/>
  <text x="295" y="167" font-family="monospace" font-size="7" fill="#f8fafc">SCL</text>
  <rect x="280" y="180" width="10" height="8" rx="1" fill="#38bdf8"/>
  <text x="295" y="187" font-family="monospace" font-size="7" fill="#f8fafc">SDA</text>
  <rect x="280" y="200" width="10" height="8" rx="1" fill="#64748b"/>
  <text x="295" y="207" font-family="monospace" font-size="7" fill="#f8fafc">AD0 ➔ GND</text>
  <!-- Wires -->
  <line x1="172" y1="105" x2="280" y2="124" stroke="#ef4444" stroke-width="2"/>
  <line x1="172" y1="130" x2="280" y2="144" stroke="#64748b" stroke-width="2"/>
  <line x1="172" y1="180" x2="280" y2="164" stroke="#F5B800" stroke-width="2"/>
  <line x1="172" y1="155" x2="280" y2="184" stroke="#38bdf8" stroke-width="2"/>
  <line x1="280" y1="204" x2="250" y2="204" stroke="#64748b" stroke-width="2"/>
  <line x1="250" y1="204" x2="250" y2="144" stroke="#64748b" stroke-width="2"/>
  <!-- Info Card -->
  <rect x="410" y="90" width="135" height="150" rx="6" fill="#090e18" stroke="#1e293b" stroke-width="1"/>
  <text x="477" y="112" font-family="monospace" font-size="9" fill="#F5B800" text-anchor="middle" font-weight="bold">I2C BUS SPECS</text>
  <text x="420" y="132" font-family="monospace" font-size="8" fill="#94a3b8">• Address: 0x68</text>
  <text x="420" y="148" font-family="monospace" font-size="8" fill="#94a3b8">• Fast Mode: 400kHz</text>
  <text x="420" y="164" font-family="monospace" font-size="8" fill="#94a3b8">• 3-Axis Gyro (Z)</text>
  <text x="420" y="180" font-family="monospace" font-size="8" fill="#94a3b8">• 3-Axis Accel (X/Y)</text>
  <text x="420" y="196" font-family="monospace" font-size="8" fill="#86efac">• Filter: α = 0.96</text>
  <text x="420" y="212" font-family="monospace" font-size="8" fill="#86efac">• Drift: &lt;1.5° / min</text>
</svg>
