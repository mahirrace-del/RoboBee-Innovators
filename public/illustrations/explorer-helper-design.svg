<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Helper robot design illustration</title>
  <desc id="desc">A child-friendly blueprint of a helper robot with sensor, brain, wheels, and emergency stop labels.</desc>
  <defs><linearGradient id="b" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111d31"/><stop offset="1" stop-color="#280d23"/></linearGradient><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#7dd3fc" stroke-opacity=".15"/></pattern></defs>
  <rect width="720" height="480" rx="28" fill="url(#b)"/><rect x="35" y="33" width="650" height="414" rx="22" fill="url(#grid)" stroke="#7dd3fc" stroke-opacity=".42" stroke-width="2"/>
  <text x="66" y="78" fill="#F5B800" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">INVENTOR'S BLUEPRINT</text><text x="66" y="107" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="800">Draw a robot that helps someone.</text>
  <g transform="translate(290 167)"><rect x="18" y="50" width="140" height="132" rx="30" fill="#6B0F24" stroke="#F5B800" stroke-width="4"/><rect x="39" y="0" width="98" height="83" rx="33" fill="#F5B800" stroke="#fff4be" stroke-width="3"/><circle cx="68" cy="39" r="11" fill="#38bdf8"/><circle cx="108" cy="39" r="11" fill="#38bdf8"/><path d="M83 7V-18h18" fill="none" stroke="#F5B800" stroke-width="7" stroke-linecap="round"/><path d="M18 90H-19M158 90h37" stroke="#F5B800" stroke-width="16" stroke-linecap="round"/><circle cx="56" cy="190" r="26" fill="#141b28" stroke="#cbd5e1" stroke-width="8"/><circle cx="120" cy="190" r="26" fill="#141b28" stroke="#cbd5e1" stroke-width="8"/><circle cx="88" cy="113" r="17" fill="#ef4444" stroke="#fff" stroke-width="3"/><text x="88" y="118" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">STOP</text></g>
  <g font-family="Arial, sans-serif"><path d="M323 187L177 146" stroke="#38bdf8" stroke-width="2"/><circle cx="170" cy="144" r="5" fill="#38bdf8"/><text x="70" y="143" fill="#a5f3fc" font-size="16" font-weight="700">SENSOR</text><text x="70" y="166" fill="#cbd5e1" font-size="13">What can it notice?</text><path d="M373 279L539 245" stroke="#c084fc" stroke-width="2"/><circle cx="548" cy="243" r="5" fill="#c084fc"/><text x="554" y="235" fill="#e9d5ff" font-size="16" font-weight="700">BRAIN RULE</text><text x="554" y="258" fill="#cbd5e1" font-size="13">How does it decide?</text><path d="M347 353L179 375" stroke="#86efac" stroke-width="2"/><circle cx="170" cy="377" r="5" fill="#86efac"/><text x="69" y="374" fill="#bbf7d0" font-size="16" font-weight="700">ACTUATOR</text><text x="69" y="397" fill="#cbd5e1" font-size="13">How does it help?</text><path d="M379 280L528 361" stroke="#fca5a5" stroke-width="2"/><circle cx="537" cy="366" r="5" fill="#fca5a5"/><text x="544" y="365" fill="#fecaca" font-size="16" font-weight="700">SAFETY STOP</text><text x="544" y="388" fill="#cbd5e1" font-size="13">How can it stop?</text></g>
</svg>
