<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="50%" stop-color="#161B26" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="bbPlastic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="bbXray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" rx="16" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="2" />

  <!-- Top Title Banner -->
  <rect x="30" y="20" width="670" height="34" rx="17" fill="rgba(245, 184, 0, 0.12)" stroke="#F5B800" stroke-width="1.2" />
  <text x="45" y="43" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#F5B800" letter-spacing="1">
    SOLDERLESS BREADBOARD ANATOMY &bull; 400 TIE-POINT INTERNAL BUS &amp; CLIP ARCHITECTURE
  </text>

  <!-- Mandatory Reference Badge -->
  <g transform="translate(730, 20)">
    <rect width="440" height="34" rx="8" fill="#6B0F24" stroke="#F5B800" stroke-width="1.2" />
    <text x="220" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
      ⚠ RoboBEE Reference Illustration — Verify Hardware Before Powering
    </text>
  </g>

  <!-- ========================================================== -->
  <!-- LEFT: TOP VIEW (PLASTIC HOUSINGS & LABELS) -->
  <!-- ========================================================== -->
  <g transform="translate(40, 75)">
    <rect width="360" height="570" rx="12" fill="#111827" stroke="#334155" stroke-width="2" />
    
    <!-- Header -->
    <rect x="0" y="0" width="360" height="42" rx="12" fill="#334155" />
    <rect x="0" y="28" width="360" height="14" fill="#334155" />
    <text x="180" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">
      EXTERNAL TOP VIEW (SURFACE)
    </text>

    <!-- Breadboard Body -->
    <g transform="translate(20, 55)">
      <rect width="320" height="495" rx="8" fill="url(#bbPlastic)" stroke="#94a3b8" stroke-width="2" />

      <!-- Left Power Rail -->
      <line x1="22" y1="20" x2="22" y2="475" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
      <line x1="42" y1="20" x2="42" y2="475" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
      <text x="22" y="14" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#ef4444" text-anchor="middle">+</text>
      <text x="42" y="14" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#3b82f6" text-anchor="middle">-</text>

      <!-- Center DIP Ravine (Center Gap) -->
      <rect x="150" y="20" width="20" height="455" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
      <text x="160" y="240" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#475569" text-anchor="middle" transform="rotate(-90 160 240)">
        CENTER INSULATING RAVINE (0.3" DIP GAP)
      </text>

      <!-- Right Power Rail -->
      <line x1="278" y1="20" x2="278" y2="475" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
      <line x1="298" y1="20" x2="298" y2="475" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
      <text x="278" y="14" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#ef4444" text-anchor="middle">+</text>
      <text x="298" y="14" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#3b82f6" text-anchor="middle">-</text>

      <!-- Column Headers -->
      <g font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#64748b" text-anchor="middle">
        <text x="65" y="14">a</text><text x="82" y="14">b</text><text x="99" y="14">c</text><text x="116" y="14">d</text><text x="133" y="14">e</text>
        <text x="187" y="14">f</text><text x="204" y="14">g</text><text x="221" y="14">h</text><text x="238" y="14">i</text><text x="255" y="14">j</text>
      </g>

      <!-- Representative Tie Points and Row Numbers -->
      <!-- Draw sample rows 1 to 15 -->
      <!-- Row 1 -->
      <text x="52" y="38" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b" text-anchor="end">1</text>
      <circle cx="22" cy="35" r="2.5" fill="#334155" /><circle cx="42" cy="35" r="2.5" fill="#334155" />
      <circle cx="65" cy="35" r="2.5" fill="#334155" /><circle cx="82" cy="35" r="2.5" fill="#334155" /><circle cx="99" cy="35" r="2.5" fill="#334155" /><circle cx="116" cy="35" r="2.5" fill="#334155" /><circle cx="133" cy="35" r="2.5" fill="#334155" />
      <circle cx="187" cy="35" r="2.5" fill="#334155" /><circle cx="204" cy="35" r="2.5" fill="#334155" /><circle cx="221" cy="35" r="2.5" fill="#334155" /><circle cx="238" cy="35" r="2.5" fill="#334155" /><circle cx="255" cy="35" r="2.5" fill="#334155" />
      <circle cx="278" cy="35" r="2.5" fill="#334155" /><circle cx="298" cy="35" r="2.5" fill="#334155" />

      <!-- Row 5 -->
      <text x="52" y="105" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b" text-anchor="end">5</text>
      <circle cx="65" cy="102" r="2.5" fill="#334155" /><circle cx="82" cy="102" r="2.5" fill="#334155" /><circle cx="99" cy="102" r="2.5" fill="#334155" /><circle cx="116" cy="102" r="2.5" fill="#334155" /><circle cx="133" cy="102" r="2.5" fill="#334155" />
      <circle cx="187" cy="102" r="2.5" fill="#334155" /><circle cx="204" cy="102" r="2.5" fill="#334155" /><circle cx="221" cy="102" r="2.5" fill="#334155" /><circle cx="238" cy="102" r="2.5" fill="#334155" /><circle cx="255" cy="102" r="2.5" fill="#334155" />

      <!-- Row 10 (Highlight for Class 1) -->
      <rect x="58" y="166" width="82" height="18" rx="4" fill="rgba(245, 184, 0, 0.25)" stroke="#F5B800" stroke-width="1.2" />
      <text x="52" y="179" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#F5B800" text-anchor="end">10</text>
      <circle cx="65" cy="175" r="3.2" fill="#161B26" stroke="#F5B800" stroke-width="1.5" />
      <circle cx="82" cy="175" r="2.5" fill="#161B26" />
      <circle cx="99" cy="175" r="3.2" fill="#161B26" stroke="#F5B800" stroke-width="1.5" />
      <circle cx="116" cy="175" r="2.5" fill="#161B26" />
      <circle cx="133" cy="175" r="2.5" fill="#161B26" />
      <text x="144" y="179" font-family="'Segoe UI', sans-serif" font-size="8" fill="#F5B800">&larr; Pin 13 in 10a</text>

      <!-- Row 15 (Highlight for Class 1 Resistor -> LED Anode) -->
      <rect x="58" y="246" width="82" height="18" rx="4" fill="rgba(245, 184, 0, 0.25)" stroke="#F5B800" stroke-width="1.2" />
      <text x="52" y="259" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#F5B800" text-anchor="end">15</text>
      <circle cx="65" cy="255" r="2.5" fill="#161B26" />
      <circle cx="82" cy="255" r="2.5" fill="#161B26" />
      <circle cx="99" cy="255" r="3.2" fill="#161B26" stroke="#F5B800" stroke-width="1.5" />
      <circle cx="116" cy="255" r="2.5" fill="#161B26" />
      <circle cx="133" cy="255" r="3.2" fill="#161B26" stroke="#F5B800" stroke-width="1.5" />
      <text x="144" y="259" font-family="'Segoe UI', sans-serif" font-size="8" fill="#F5B800">&larr; LED Anode (+)</text>

      <!-- Row 16 (Highlight for Class 1 LED Cathode -> GND) -->
      <rect x="58" y="266" width="82" height="18" rx="4" fill="rgba(56, 189, 248, 0.25)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="52" y="279" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#38BDF8" text-anchor="end">16</text>
      <circle cx="65" cy="275" r="3.2" fill="#161B26" stroke="#38BDF8" stroke-width="1.5" />
      <circle cx="82" cy="275" r="2.5" fill="#161B26" />
      <circle cx="99" cy="275" r="2.5" fill="#161B26" />
      <circle cx="116" cy="275" r="2.5" fill="#161B26" />
      <circle cx="133" cy="275" r="3.2" fill="#161B26" stroke="#38BDF8" stroke-width="1.5" />
      <text x="144" y="279" font-family="'Segoe UI', sans-serif" font-size="8" fill="#38BDF8">&larr; LED Cathode (-)</text>

      <!-- Row 20 & 30 representation -->
      <text x="52" y="340" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b" text-anchor="end">20</text>
      <text x="52" y="465" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b" text-anchor="end">30</text>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- CENTER: X-RAY VIEW (INTERNAL METAL SPRING CLIPS) -->
  <!-- ========================================================== -->
  <g transform="translate(420, 75)">
    <rect width="360" height="570" rx="12" fill="url(#bbXray)" stroke="#F5B800" stroke-width="2" />

    <!-- Header -->
    <rect x="0" y="0" width="360" height="42" rx="12" fill="#F5B800" />
    <rect x="0" y="28" width="360" height="14" fill="#F5B800" />
    <text x="180" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="900" fill="#161B26" text-anchor="middle">
      X-RAY: HIDDEN METAL CONNECTIONS
    </text>

    <!-- Inside X-Ray Body -->
    <g transform="translate(20, 55)">
      <!-- Vertical Continuous Power Rails (Golden Strips) -->
      <rect x="16" y="20" width="12" height="455" rx="3" fill="#ef4444" opacity="0.85" />
      <rect x="36" y="20" width="12" height="455" rx="3" fill="#3b82f6" opacity="0.85" />
      <text x="22" y="240" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" transform="rotate(-90 22 240)">
        + 5V VERTICAL CONTINUOUS BUS BAR
      </text>
      <text x="42" y="240" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" transform="rotate(-90 42 240)">
        - GND VERTICAL CONTINUOUS BUS BAR
      </text>

      <!-- Center DIP Gap Divider -->
      <line x1="160" y1="20" x2="160" y2="475" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" />
      <text x="160" y="235" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="800" fill="#fca5a5" text-anchor="middle" transform="rotate(-90 160 235)">
        ELECTRICAL ISOLATION BARRIER (NO METAL ACROSS GAP)
      </text>

      <!-- Representative 5-hole horizontal metal clips -->
      <!-- Let's draw horizontal metal clip bars on the left (a-e) and right (f-j) -->
      <!-- Row 10 Clip Left -->
      <rect x="58" y="165" width="86" height="20" rx="4" fill="#F5B800" stroke="#ffffff" stroke-width="1.5" />
      <text x="101" y="179" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#161B26" text-anchor="middle">
        10a - 10e CONNECTED
      </text>

      <!-- Row 10 Clip Right (Isolated!) -->
      <rect x="176" y="165" width="86" height="20" rx="4" fill="#475569" stroke="#64748b" stroke-width="1" />
      <text x="219" y="179" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#cbd5e1" text-anchor="middle">
        10f - 10j SEPARATE
      </text>

      <!-- Row 15 Clip Left (Class 1) -->
      <rect x="58" y="245" width="86" height="20" rx="4" fill="#F5B800" stroke="#ffffff" stroke-width="1.5" />
      <text x="101" y="259" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#161B26" text-anchor="middle">
        15a - 15e CONNECTED
      </text>

      <!-- Row 16 Clip Left (Class 1) -->
      <rect x="58" y="265" width="86" height="20" rx="4" fill="#38BDF8" stroke="#ffffff" stroke-width="1.5" />
      <text x="101" y="279" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#161B26" text-anchor="middle">
        16a - 16e CONNECTED
      </text>

      <!-- Generic row clips to illustrate the pattern -->
      <rect x="58" y="55" width="86" height="14" rx="2" fill="rgba(245, 184, 0, 0.3)" />
      <rect x="176" y="55" width="86" height="14" rx="2" fill="rgba(245, 184, 0, 0.3)" />

      <rect x="58" y="95" width="86" height="14" rx="2" fill="rgba(245, 184, 0, 0.3)" />
      <rect x="176" y="95" width="86" height="14" rx="2" fill="rgba(245, 184, 0, 0.3)" />

      <rect x="58" y="135" width="86" height="14" rx="2" fill="rgba(245, 184, 0, 0.3)" />
      <rect x="176" y="135" width="86" height="14" rx="2" fill="rgba(245, 184, 0, 0.3)" />

      <rect x="58" y="325" width="86" height="14" rx="2" fill="rgba(245, 184, 0, 0.3)" />
      <rect x="176" y="325" width="86" height="14" rx="2" fill="rgba(245, 184, 0, 0.3)" />

      <rect x="58" y="385" width="86" height="14" rx="2" fill="rgba(245, 184, 0, 0.3)" />
      <rect x="176" y="385" width="86" height="14" rx="2" fill="rgba(245, 184, 0, 0.3)" />

      <!-- Golden explanation callout -->
      <rect x="20" y="420" width="280" height="58" rx="8" fill="#111827" stroke="#F5B800" stroke-width="1.5" />
      <text x="160" y="438" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="800" fill="#F5B800" text-anchor="middle">
        GOLDEN RULE OF BREADBOARDS:
      </text>
      <text x="160" y="455" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#f1f5f9" text-anchor="middle">
        Holes in the SAME row (a–e) share ONE wire clip.
      </text>
      <text x="160" y="470" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#38BDF8" text-anchor="middle">
        Holes in DIFFERENT rows are completely isolated!
      </text>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- RIGHT: COMMON MISTAKE VS CORRECT CIRCUIT CALLOUT -->
  <!-- ========================================================== -->
  <g transform="translate(800, 75)">
    <rect width="360" height="570" rx="12" fill="#111827" stroke="#334155" stroke-width="2" />

    <!-- Header -->
    <rect x="0" y="0" width="360" height="42" rx="12" fill="#6B0F24" />
    <rect x="0" y="28" width="360" height="14" fill="#6B0F24" />
    <text x="180" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">
      CRITICAL STUDENT CALLOUT
    </text>

    <!-- WRONG BOX (Same Row Short) -->
    <g transform="translate(20, 60)">
      <rect width="320" height="215" rx="10" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-width="2" />
      <rect x="0" y="0" width="320" height="32" rx="10" fill="#ef4444" />
      <rect x="0" y="20" width="320" height="12" fill="#ef4444" />
      <text x="160" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">
        ❌ WRONG: SHORTED LED (SAME ROW)
      </text>

      <!-- Diagram of shorted LED -->
      <rect x="30" y="46" width="260" height="40" rx="4" fill="#090e18" stroke="#ef4444" stroke-width="1.2" />
      <text x="40" y="68" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fca5a5">Row 15 [15b]   [15c]   [15d]</text>
      <!-- LED legs in same strip -->
      <path d="M 120,68 C 120,120 200,120 200,68" fill="none" stroke="#ef4444" stroke-width="3" />
      <circle cx="160" cy="115" r="14" fill="#ef4444" opacity="0.4" stroke="#ef4444" stroke-width="2" />
      <text x="160" y="119" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">LED</text>

      <text x="160" y="152" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#ef4444" text-anchor="middle">
        Both legs touch the SAME metal clip!
      </text>
      <text x="160" y="172" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">
        Electricity bypasses the LED diode completely.
      </text>
      <text x="160" y="190" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#fca5a5" text-anchor="middle">
        Result: LED stays 100% DARK.
      </text>
    </g>

    <!-- CORRECT BOX (Different Rows) -->
    <g transform="translate(20, 295)">
      <rect width="320" height="250" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="2" />
      <rect x="0" y="0" width="320" height="32" rx="10" fill="#10b981" />
      <rect x="0" y="20" width="320" height="12" fill="#10b981" />
      <text x="160" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#161B26" text-anchor="middle">
        ✅ CORRECT: LEGS IN DIFFERENT ROWS
      </text>

      <!-- Diagram of correct LED spanning rows -->
      <rect x="30" y="46" width="260" height="70" rx="4" fill="#090e18" stroke="#10b981" stroke-width="1.2" />
      <text x="40" y="66" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F5B800">Row 15: Anode (+ Long Leg) in 15e</text>
      <text x="40" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">Row 16: Cathode (- Short) in 16e</text>

      <!-- LED Bridge icon -->
      <circle cx="160" cy="148" r="16" fill="#10b981" opacity="0.3" stroke="#10b981" stroke-width="2" />
      <text x="160" y="153" font-family="'Segoe UI', sans-serif" font-size="16" text-anchor="middle">💡</text>

      <text x="160" y="185" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#10b981" text-anchor="middle">
        Current must flow THROUGH the LED!
      </text>
      <text x="160" y="204" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">
        Enters Row 15 &rarr; LED emits light &rarr; Exits Row 16 to GND.
      </text>
      <text x="160" y="224" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="800" fill="#F5B800" text-anchor="middle">
        Result: Bright, safe, programmable blinking!
      </text>
    </g>
  </g>
</svg>
